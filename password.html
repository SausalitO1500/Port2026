<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter — Daniela Ramirez Torres</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="password-page">
    <main class="password-gate">
      <div class="password-gate__shell">
        <div class="password-gate__layout">
          <img
            class="password-gate__logo"
            src="assets/Logos/drt-logo-password.svg"
            alt="Daniela Ramirez Torres."
            width="264"
            height="196"
          />

          <div class="password-gate__intro">
            <h1 class="password-gate__headline">
              I care about what design
              <span class="accent-orange">changes for people</span>, and I know how to turn
              <span class="accent-coral">complex ideas</span> into products that are
              <span class="accent-blue">real, useful, and scalable</span>.
            </h1>
            <p class="password-gate__lede">
              I believe in making the most of our time, bringing good people and bold ideas together
              to create something worthwhile. Come see for yourself.
            </p>
          </div>

          <form class="password-gate__form" id="gate-form" novalidate>
            <div class="password-gate__label-row">
              <img
                class="password-gate__lock"
                src="assets/icons/lock.svg"
                alt=""
                width="24"
                height="24"
              />
              <label class="password-gate__label" for="password">Password</label>
            </div>

            <input
              class="password-gate__input"
              id="password"
              name="password"
              type="password"
              placeholder="Enter password to access site"
              autocomplete="current-password"
              required
            />

            <button class="btn btn--primary password-gate__submit" type="submit">
              Enter Site
            </button>

            <p class="password-gate__error" id="gate-error" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </main>

    <script>
      const SITE_PASSWORD = "D3sign4Impact";
      const form = document.getElementById("gate-form");
      const error = document.getElementById("gate-error");

      if (sessionStorage.getItem("drmzt-auth") === "1") {
        window.location.replace("index.html");
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const value = new FormData(form).get("password");
        if (value === SITE_PASSWORD) {
          sessionStorage.setItem("drmzt-auth", "1");
          window.location.href = "index.html";
          return;
        }
        error.textContent = "That password isn’t right. Try again.";
      });
    </script>
  </body>
</html>
